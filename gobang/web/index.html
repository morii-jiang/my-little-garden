<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>五子棋 · 暖暖小屋</title>
<style>
  :root{
    --ink:#6b5142;
    --ink-soft:#9a8070;
    --ink-faint:#b7a08d;
    --line:#efdcc8;
    --paper:#fffaf3;
    --shadow:0 22px 45px -22px rgba(150,102,62,.5), 0 6px 14px -8px rgba(150,102,62,.25);
    --ease:cubic-bezier(.22,1.2,.36,1);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }

  body{
    margin:0;
    display:grid; place-items:center;
    padding:24px 16px 40px;
    font-family:"Nunito","Quicksand","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 620px at 50% -12%, #ffe9d1 0%, rgba(255,233,209,0) 62%),
      radial-gradient(760px 520px at 8% 108%, #ffe3cf 0%, rgba(255,227,207,0) 60%),
      radial-gradient(820px 560px at 96% 96%, #f7dcc4 0%, rgba(247,220,196,0) 62%),
      linear-gradient(180deg,#fdf1e2 0%,#f6e3d0 52%,#f1d8c3 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }

  .blobs{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .blob{
    position:absolute; border-radius:50%; filter:blur(28px); opacity:.5;
    animation:drift 18s ease-in-out infinite;
  }
  .blob:nth-child(1){ width:230px; height:230px; left:4%; top:12%; background:#ffd8b3; }
  .blob:nth-child(2){ width:180px; height:180px; right:6%; top:24%; background:#ffcfa8; animation-delay:-6s; }
  .blob:nth-child(3){ width:260px; height:260px; right:14%; bottom:2%; background:#ffdcbe; animation-delay:-11s; }
  .blob:nth-child(4){ width:160px; height:160px; left:12%; bottom:6%; background:#f8cdbf; animation-delay:-3s; }
  @keyframes drift{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%{ transform:translate3d(14px,-22px,0) scale(1.07); }
  }

  .app{
    position:relative; z-index:1;
    width:min(430px, 100%);
    display:flex; flex-direction:column; gap:13px;
  }

  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; }

  .brand h1{
    margin:0;
    font-size:38px; line-height:1; letter-spacing:.02em; font-weight:800;
    background:linear-gradient(160deg,#e8875f 0%,#c9603f 55%,#a44a34 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 2px 0 rgba(255,255,255,.55);
  }
  .brand .sub{ margin:6px 0 0; font-size:12.5px; color:var(--ink-soft); letter-spacing:.08em; }

  .scores{ display:flex; gap:8px; }
  .score{
    min-width:74px; padding:7px 12px 8px;
    background:linear-gradient(180deg,#fffdf9,#fdf1e2);
    border:1px solid var(--line);
    border-radius:14px;
    text-align:center;
    box-shadow:inset 0 1px 0 #fff, 0 6px 12px -10px rgba(150,102,62,.7);
  }
  .score span{ display:block; font-size:10.5px; letter-spacing:.16em; color:var(--ink-faint); }
  .score strong{ display:block; font-size:19px; font-weight:800; }

  /* 轮到谁 */
  .turnbar{ display:flex; align-items:center; gap:8px; }
  .chip{
    display:flex; align-items:center; gap:7px;
    padding:7px 13px 7px 8px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,252,247,.66);
    font-size:12.5px; font-weight:700; color:var(--ink-faint);
    box-shadow:inset 0 1px 0 #fff;
    transition:transform .18s var(--ease), color .2s ease, border-color .2s ease, background .2s ease;
  }
  .chip .dot{
    width:20px; height:20px; border-radius:50%;
    box-shadow:0 2px 3px rgba(60,35,20,.28), inset 0 1px 1px rgba(255,255,255,.4);
  }
  .chip.black .dot{ background:radial-gradient(circle at 32% 28%, #6b4a36, #3c2820 62%, #2a1b16); }
  .chip.white .dot{ background:radial-gradient(circle at 32% 28%, #fffdf8, #f0e0c8 60%, #d8c1a2); box-shadow:0 2px 3px rgba(120,85,50,.3), inset 0 0 0 1px #e2cdb0; }
  .chip.active{ color:var(--ink); border-color:#e7c9a8; background:linear-gradient(180deg,#fff8ee,#fdeacd); transform:translateY(-1px); }
  .chip.done{ opacity:.5; }

  .btns{ display:flex; gap:7px; margin-left:auto; }

  .btn{
    appearance:none; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:700; color:#7a4a2f;
    padding:8px 13px;
    border:1px solid #eccfae;
    border-radius:12px;
    background:linear-gradient(180deg,#ffeedb,#fcdcc0);
    box-shadow:0 3px 0 #e9c4a3, 0 8px 14px -10px rgba(150,102,62,.9), inset 0 1px 0 #fff;
    transition:transform .12s var(--ease), box-shadow .12s ease, filter .15s ease;
    white-space:nowrap;
  }
  .btn:hover{ filter:brightness(1.03); }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #e9c4a3, 0 4px 8px -8px rgba(150,102,62,.9), inset 0 1px 0 #fff; }
  .btn.ghost{
    background:rgba(255,252,247,.7); color:var(--ink-soft); border-color:#e8d6c2;
    box-shadow:0 2px 0 #e8d6c2, inset 0 1px 0 #fff;
  }
  .btn.ghost:active{ box-shadow:0 0 0 #e8d6c2, inset 0 1px 0 #fff; }
  .btn.icon{ padding:8px 10px; font-size:14px; }
  .btn[disabled]{ opacity:.42; cursor:default; transform:none; }

  .badge{
    padding:7px 12px; font-size:12px; color:var(--ink-soft);
    background:rgba(255,250,243,.72);
    border:1px dashed #e6cfb6;
    border-radius:999px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    flex:1 1 auto; min-width:0;
  }

  /* ---------- 棋盘 ---------- */
  .board-wrap{ position:relative; }

  .board{
    position:relative;
    aspect-ratio:1/1;
    border-radius:22px;
    border:1px solid #e0bb92;
    background:
      repeating-linear-gradient(114deg, rgba(156,108,68,.055) 0 5px, rgba(255,255,255,0) 5px 13px),
      linear-gradient(160deg,#f3d8b3 0%,#edcba4 45%,#e6bd91 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.75),
      inset 0 -3px 0 rgba(150,100,60,.22),
      0 18px 34px -18px rgba(140,92,52,.8),
      0 2px 0 #dbb287;
    touch-action:manipulation;
    overflow:hidden;
  }

  .grid{ position:absolute; inset:0; width:100%; height:100%; }
  .grid line{ stroke:#b0805a; stroke-width:.26; stroke-linecap:round; opacity:.7; }
  .grid circle{ fill:#ad7a52; opacity:.85; }

  .coords{ position:absolute; inset:0; pointer-events:none; }
  .coords b{
    position:absolute;
    font-size:8.5px; font-weight:700; color:#a87d59; opacity:.85;
    transform:translate(-50%,-50%);
  }
  .coords b.c{ bottom:0; }
  .coords b.r{ left:0; }

  .layer{ position:absolute; inset:0; }
  .stones{ z-index:2; pointer-events:none; }
  .spots{ z-index:1; }

  .spot{
    position:absolute;
    width:8.6%; height:8.6%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    cursor:pointer;
    display:grid; place-items:center;
    /* 清掉 button 的默认外观,否则每个点位都会变成一个灰底圆按钮挡住棋子 */
    appearance:none; -webkit-appearance:none;
    border:0; padding:0; margin:0; background:none;
    font:inherit; color:inherit; box-shadow:none;
  }
  .spot::after{
    content:"";
    width:74%; height:74%;
    border-radius:50%;
    opacity:0;
    transform:scale(.6);
    transition:opacity .15s ease, transform .18s var(--ease);
  }
  .board.turn-1 .spot:not(.taken)::after{
    background:radial-gradient(circle at 32% 28%, rgba(90,60,40,.75), rgba(50,32,24,.7));
  }
  .board.turn-2 .spot:not(.taken)::after{
    background:radial-gradient(circle at 32% 28%, rgba(255,252,244,.95), rgba(232,214,186,.9));
  }
  .spot:hover::after{ opacity:.42; transform:scale(1); }
  .spot.taken{ cursor:default; }
  .spot.taken::after{ opacity:0 !important; }
  .spot:disabled{ cursor:default; }

  .stone{
    position:absolute;
    width:7.4%; height:7.4%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
    animation:drop .22s var(--ease);
  }
  @keyframes drop{
    0%{ transform:translate(-50%,-50%) scale(1.5); opacity:.2; }
    70%{ transform:translate(-50%,-50%) scale(.96); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1); }
  }
  .stone.p1{
    background:radial-gradient(circle at 32% 26%, #7a5641 0%, #4a3227 45%, #2a1b16 100%);
    box-shadow:0 2px 4px rgba(50,28,16,.45), inset 0 1px 2px rgba(255,255,255,.28), inset 0 -2px 3px rgba(0,0,0,.45);
  }
  .stone.p2{
    background:radial-gradient(circle at 32% 26%, #fffefb 0%, #f6ead6 48%, #dcc4a4 100%);
    box-shadow:0 2px 4px rgba(110,76,44,.32), inset 0 1px 2px rgba(255,255,255,.95), inset 0 -2px 3px rgba(160,124,86,.35);
  }
  .stone.last::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    box-shadow:inset 0 0 0 1.5px rgba(232,150,90,.95);
  }
  .stone.win{
    animation:winpulse 1.1s ease-in-out infinite;
    z-index:3;
  }
  @keyframes winpulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(236,150,90,.55), 0 2px 4px rgba(60,35,20,.4); }
    50%{ box-shadow:0 0 0 6px rgba(236,150,90,0), 0 2px 4px rgba(60,35,20,.4); }
  }

  /* ---------- 遮罩 ---------- */
  .overlay{
    position:absolute; inset:0; z-index:6;
    display:grid; place-items:center;
    border-radius:22px;
    background:rgba(255,246,235,.8);
    backdrop-filter:blur(4px) saturate(1.05);
    animation:fade .25s ease-out;
  }
  .overlay[hidden]{ display:none; }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

  .overlay-card{
    text-align:center; padding:20px 22px;
    width:min(280px,84%);
    background:linear-gradient(180deg,#fffdf8,#fdf2e3);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    animation:rise .3s var(--ease);
  }
  @keyframes rise{ from{ transform:translateY(10px) scale(.96); opacity:0; } to{ transform:none; opacity:1; } }
  .overlay-card h2{ margin:0 0 6px; font-size:22px; letter-spacing:.02em; }
  .overlay-card p{ margin:0 0 16px; font-size:13px; line-height:1.7; color:var(--ink-soft); }
  .overlay-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }

  .tips{ margin:0; text-align:center; font-size:11.5px; letter-spacing:.06em; color:var(--ink-faint); }
  .tips kbd{
    font-family:inherit; font-size:10.5px; font-weight:700;
    padding:1px 5px; border-radius:5px;
    background:rgba(255,255,255,.8); border:1px solid #e8d5bf; color:var(--ink-soft);
  }

  @media (max-width:400px){
    .brand h1{ font-size:31px; }
    .score{ min-width:62px; padding:6px 9px; }
    .coords b{ font-size:7.5px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }
</style>
</head>
<body>
<div class="blobs" aria-hidden="true">
  <span class="blob"></span><span class="blob"></span><span class="blob"></span><span class="blob"></span>
</div>

<main class="app">
  <header class="topbar">
    <div class="brand">
      <h1>五子棋</h1>
      <p class="sub">暖暖小屋 · 落子无悔</p>
    </div>
    <div class="scores">
      <div class="score"><span>步数</span><strong id="moves">0</strong></div>
      <div class="score"><span>黑 / 白</span><strong id="tally">0 : 0</strong></div>
    </div>
  </header>

  <div class="turnbar">
    <div class="chip black active" id="chip1"><span class="dot"></span>黑棋</div>
    <div class="chip white" id="chip2"><span class="dot"></span>白棋</div>
    <div class="btns">
      <button class="btn ghost" id="undo" disabled>↩ 悔棋</button>
      <button class="btn" id="newGame">✨ 新一局</button>
      <button class="btn icon" id="sound" title="声音">🔔</button>
    </div>
  </div>

  <section class="board-wrap">
    <div class="board turn-1" id="board">
      <svg class="grid" id="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="coords" id="coords" aria-hidden="true"></div>
      <div class="layer stones" id="stoneLayer"></div>
      <div class="layer spots" id="spotLayer"></div>
    </div>
    <div class="overlay" id="overlay" hidden>
      <div class="overlay-card">
        <h2 id="ovTitle">这局结束啦</h2>
        <p id="ovText"></p>
        <div class="overlay-actions">
          <button class="btn ghost" id="ovUndo">悔一步</button>
          <button class="btn" id="ovRestart">再来一局</button>
        </div>
      </div>
    </div>
  </section>

  <p class="tips">点空格落子 · 横竖斜连成 <b>五子</b> 即胜 · 13 × 13 满盘为和棋</p>
</main>

<script>
(() => {
  'use strict';

  const N = 13;            // 13x13 可落子区(对应 C 版 arr[1..13][1..13])
  const PAD = 6;           // 棋盘留白(百分比)
  const STEP = (100 - PAD * 2) / (N - 1);
  const MUTE_KEY = 'cozyGobang.muted';

  const $ = (id) => document.getElementById(id);
  const boardEl = $('board');
  const gridEl = $('grid');
  const coordsEl = $('coords');
  const stoneLayer = $('stoneLayer');
  const spotLayer = $('spotLayer');
  const movesEl = $('moves');
  const tallyEl = $('tally');
  const chip1 = $('chip1');
  const chip2 = $('chip2');
  const undoBtn = $('undo');
  const overlay = $('overlay');
  const ovTitle = $('ovTitle');
  const ovText = $('ovText');
  const ovUndo = $('ovUndo');

  const pos = (k) => PAD + k * STEP;        // 第 k 个交点(0-based)的百分比坐标

  const state = {
    board: [],        // board[y][x] = 0 | 1 | 2
    turn: 1,
    moves: 0,
    history: [],
    over: false,
    winner: 0,
    winCells: [],
    muted: localStorage.getItem(MUTE_KEY) === '1',
  };

  const stoneEls = [];   // [y][x] -> stone div 或 null
  const spotEls = [];    // [y][x] -> spot div

  /* ---------------- 棋盘骨架 ---------------- */

  function buildBoard() {
    // 网格线
    let svg = '';
    for (let k = 0; k < N; k++) {
      const p = pos(k);
      svg += `<line x1="${PAD}" y1="${p}" x2="${100 - PAD}" y2="${p}" />`;   // 横线
      svg += `<line x1="${p}" y1="${PAD}" x2="${p}" y2="${100 - PAD}" />`;   // 竖线
    }
    // 星位(装饰)
    [[3, 3], [3, 9], [9, 3], [9, 9], [6, 6]].forEach(([x, y]) => {
      svg += `<circle cx="${pos(x)}" cy="${pos(y)}" r="0.85" />`;
    });
    gridEl.innerHTML = svg;

    // 坐标标签(沿用 C 版:1..9 后接 a b c d)
    const label = (i) => (i < 10 ? String(i) : String.fromCharCode(97 + i - 10));
    let co = '';
    for (let i = 1; i <= N; i++) {
      co += `<b class="c" style="left:${pos(i - 1)}%; bottom:1.6%">${label(i)}</b>`;
      co += `<b class="r" style="top:${pos(i - 1)}%; left:1.8%">${label(i)}</b>`;
    }
    coordsEl.innerHTML = co;

    // 落子层 + 棋子层
    for (let y = 0; y < N; y++) {
      stoneEls.push([]);
      spotEls.push([]);
      for (let x = 0; x < N; x++) {
        const spot = document.createElement('button');
        spot.type = 'button';
        spot.className = 'spot';
        spot.style.left = pos(x) + '%';
        spot.style.top = pos(y) + '%';
        spot.setAttribute('aria-label', 'x' + (x + 1) + ' y' + (y + 1));
        spot.addEventListener('click', () => place(x, y));
        spotLayer.appendChild(spot);
        spotEls[y].push(spot);
        stoneEls[y].push(null);
      }
    }
  }

  /* ---------------- 声音 ---------------- */

  let audioCtx = null;
  function blip(freq, dur, vol, type) {
    if (state.muted) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.86, t + dur);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (_) { /* 静默失败 */ }
  }

  /* ---------------- 规则 ---------------- */

  const inBoard = (x, y) => x >= 0 && y >= 0 && x < N && y < N;

  const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];

  // 返回 >= 5 连的那条线(所有格子),否则 null
  function findWin(x, y, p) {
    for (const [dx, dy] of DIRS) {
      const cells = [[x, y]];
      for (const s of [1, -1]) {
        let nx = x + dx * s, ny = y + dy * s;
        while (inBoard(nx, ny) && state.board[ny][nx] === p) {
          cells.push([nx, ny]);
          nx += dx * s; ny += dy * s;
        }
      }
      if (cells.length >= 5) return cells;
    }
    return null;
  }

  /* ---------------- 渲染 ---------------- */

  function paintStone(x, y, p, isLast, isWin) {
    const old = stoneEls[y][x];
    if (old) old.remove();
    if (!p) { stoneEls[y][x] = null; return; }
    const el = document.createElement('div');
    el.className = 'stone p' + p + (isLast ? ' last' : '') + (isWin ? ' win' : '');
    el.style.left = pos(x) + '%';
    el.style.top = pos(y) + '%';
    stoneLayer.appendChild(el);
    stoneEls[y][x] = el;
  }

  function syncHud() {
    const [black, white] = [1, 2].map((p) =>
      state.board.reduce((acc, row) => acc + row.filter((v) => v === p).length, 0)
    );
    movesEl.textContent = state.moves;
    tallyEl.textContent = black + ' : ' + white;

    const playing = !state.over;
    chip1.classList.toggle('active', playing && state.turn === 1);
    chip2.classList.toggle('active', playing && state.turn === 2);
    chip1.classList.toggle('done', !playing);
    chip2.classList.toggle('done', !playing);
    boardEl.classList.toggle('turn-1', state.turn === 1 || state.over);
    boardEl.classList.toggle('turn-2', state.turn === 2 && !state.over);
    undoBtn.disabled = state.history.length === 0;
    ovUndo.disabled = state.history.length === 0;
  }

  /* ---------------- 落子 / 悔棋 ---------------- */

  function place(x, y) {
    if (state.over) return;
    if (state.board[y][x] !== 0) { blip(180, 0.08, 0.035, 'triangle'); return; }

    const p = state.turn;
    state.board[y][x] = p;
    state.history.push({ x, y, p });
    state.moves++;

    // 上一手的 last 标记要清掉
    const prev = state.history[state.history.length - 2];
    if (prev) paintStone(prev.x, prev.y, prev.p, false, false);

    paintStone(x, y, p, true, false);
    spotEls[y][x].classList.add('taken');
    blip(p === 1 ? 330 : 440, 0.09, 0.045, 'sine');

    const line = findWin(x, y, p);
    if (line) {
      state.over = true;
      state.winner = p;
      state.winCells = line;
      line.forEach(([cx, cy]) => paintStone(cx, cy, p, cx === x && cy === y, true));
      syncHud();
      const name = p === 1 ? '黑棋' : '白棋';
      showOverlay(name + '连成五子！', '一共走了 <b>' + state.moves + '</b> 步，这一局暖暖的。');
      blip(700, 0.22, 0.05, 'sine');
      setTimeout(() => blip(880, 0.26, 0.045, 'sine'), 120);
      return;
    }

    if (state.moves === N * N) {
      state.over = true;
      state.winner = 0;
      syncHud();
      showOverlay('棋盘满啦', '和棋，谁也没赢。这一盘很温柔。');
      blip(300, 0.3, 0.05, 'sine');
      return;
    }

    state.turn = 3 - state.turn;
    syncHud();
  }

  function undo() {
    if (!state.history.length) return;
    const last = state.history.pop();
    state.board[last.y][last.x] = 0;
    paintStone(last.x, last.y, 0, false, false);
    spotEls[last.y][last.x].classList.remove('taken');
    state.moves--;
    state.over = false;
    state.winner = 0;
    state.winCells = [];
    state.turn = last.p;          // 悔掉的就是这手，还是他重下
    overlay.hidden = true;

    // 重新标记新的最后一手
    const prev = state.history[state.history.length - 1];
    if (prev) paintStone(prev.x, prev.y, prev.p, true, false);

    syncHud();
    blip(360, 0.1, 0.04, 'sine');
  }

  function newGame() {
    state.board = Array.from({ length: N }, () => new Array(N).fill(0));
    state.turn = 1;
    state.moves = 0;
    state.history = [];
    state.over = false;
    state.winner = 0;
    state.winCells = [];
    stoneLayer.innerHTML = '';
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        stoneEls[y][x] = null;
        spotEls[y][x].classList.remove('taken');
      }
    }
    overlay.hidden = true;
    syncHud();
  }

  function showOverlay(title, text) {
    ovTitle.textContent = title;
    ovText.innerHTML = text;
    overlay.hidden = false;
  }

  /* ---------------- 按钮 / 声音开关 ---------------- */

  $('newGame').addEventListener('click', newGame);
  $('ovRestart').addEventListener('click', newGame);
  undoBtn.addEventListener('click', undo);
  ovUndo.addEventListener('click', undo);

  const soundBtn = $('sound');
  function syncSoundBtn() {
    soundBtn.textContent = state.muted ? '🔇' : '🔔';
    soundBtn.title = state.muted ? '已静音，点一下开声音' : '声音已开，点一下静音';
  }
  soundBtn.addEventListener('click', () => {
    state.muted = !state.muted;
    try { localStorage.setItem(MUTE_KEY, state.muted ? '1' : '0'); } catch (_) {}
    syncSoundBtn();
    if (!state.muted) blip(620, 0.12, 0.05, 'sine');
  });

  /* ---------------- 启动 ---------------- */

  buildBoard();
  syncSoundBtn();
  newGame();
})();
</script>
</body>
</html>
