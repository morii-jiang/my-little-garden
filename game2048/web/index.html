<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>2048 · 暖暖小屋</title>
<style>
  :root{
    --ink:#6b5142;
    --ink-soft:#9a8070;
    --ink-faint:#b7a08d;
    --line:#efdcc8;
    --paper:#fffaf3;
    --cell:#f2e2d0;
    --shadow:0 22px 45px -22px rgba(150,102,62,.5), 0 6px 14px -8px rgba(150,102,62,.25);
    --ease:cubic-bezier(.22,1.2,.36,1);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; }

  body{
    margin:0;
    display:grid;
    place-items:center;
    padding:24px 16px 40px;
    font-family:"Nunito","Quicksand","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 620px at 50% -12%, #ffe9d1 0%, rgba(255,233,209,0) 62%),
      radial-gradient(760px 520px at 8% 108%, #ffe3cf 0%, rgba(255,227,207,0) 60%),
      radial-gradient(820px 560px at 96% 96%, #f7dcc4 0%, rgba(247,220,196,0) 62%),
      linear-gradient(180deg,#fdf1e2 0%,#f6e3d0 52%,#f1d8c3 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }

  /* 漂浮的暖色光斑 */
  .blobs{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .blob{
    position:absolute; border-radius:50%; filter:blur(28px); opacity:.5;
    animation:drift 18s ease-in-out infinite;
  }
  .blob:nth-child(1){ width:230px; height:230px; left:4%; top:12%; background:#ffd8b3; }
  .blob:nth-child(2){ width:180px; height:180px; right:6%; top:24%; background:#ffcfa8; animation-delay:-6s; }
  .blob:nth-child(3){ width:260px; height:260px; right:14%; bottom:2%; background:#ffdcbe; animation-delay:-11s; }
  .blob:nth-child(4){ width:160px; height:160px; left:12%; bottom:6%; background:#f8cdbf; animation-delay:-3s; }
  @keyframes drift{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%{ transform:translate3d(14px,-22px,0) scale(1.07); }
  }

  .app{
    position:relative; z-index:1;
    width:min(430px, 100%);
    display:flex; flex-direction:column; gap:14px;
  }

  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; }

  .brand h1{
    margin:0;
    font-size:42px; line-height:1; letter-spacing:.02em; font-weight:800;
    background:linear-gradient(160deg,#e8875f 0%,#c9603f 55%,#a44a34 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 2px 0 rgba(255,255,255,.55);
  }
  .brand .sub{ margin:6px 0 0; font-size:12.5px; color:var(--ink-soft); letter-spacing:.08em; }

  .scores{ display:flex; gap:8px; }
  .score{
    min-width:78px; padding:7px 12px 8px;
    background:linear-gradient(180deg,#fffdf9,#fdf1e2);
    border:1px solid var(--line);
    border-radius:14px;
    text-align:center;
    box-shadow:inset 0 1px 0 #fff, 0 6px 12px -10px rgba(150,102,62,.7);
    transition:transform .18s var(--ease);
  }
  .score.bump{ transform:scale(1.07); }
  .score span{ display:block; font-size:10.5px; letter-spacing:.16em; color:var(--ink-faint); }
  .score strong{ display:block; font-size:19px; font-weight:800; letter-spacing:.01em; }

  .hud{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  .badge{
    flex:1 1 auto; min-width:0;
    padding:7px 12px;
    font-size:12px; color:var(--ink-soft);
    background:rgba(255,250,243,.72);
    border:1px dashed #e6cfb6;
    border-radius:999px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .btns{ display:flex; gap:7px; flex:0 0 auto; }

  .btn{
    appearance:none; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:700; color:#7a4a2f;
    padding:8px 14px;
    border:1px solid #eccfae;
    border-radius:12px;
    background:linear-gradient(180deg,#ffeedb,#fcdcc0);
    box-shadow:0 3px 0 #e9c4a3, 0 8px 14px -10px rgba(150,102,62,.9), inset 0 1px 0 #fff;
    transition:transform .12s var(--ease), box-shadow .12s ease, filter .15s ease;
    white-space:nowrap;
  }
  .btn:hover{ filter:brightness(1.03); }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #e9c4a3, 0 4px 8px -8px rgba(150,102,62,.9), inset 0 1px 0 #fff; }
  .btn.ghost{
    background:rgba(255,252,247,.7); color:var(--ink-soft); border-color:#e8d6c2;
    box-shadow:0 2px 0 #e8d6c2, inset 0 1px 0 #fff;
  }
  .btn.ghost:active{ box-shadow:0 0 0 #e8d6c2, inset 0 1px 0 #fff; }
  .btn.icon{ padding:8px 10px; font-size:14px; }
  .btn[disabled]{ opacity:.42; cursor:default; transform:none; }

  /* ---------- 棋盘 ---------- */
  .board-wrap{ position:relative; }

  .board{
    position:relative;
    display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr);
    gap:10px; padding:12px;
    aspect-ratio:1/1;
    border-radius:24px;
    background:linear-gradient(180deg,#f4e3cf,#eed7bd);
    box-shadow:
      inset 0 2px 6px rgba(163,116,74,.22),
      inset 0 -2px 0 rgba(255,255,255,.5),
      0 16px 30px -20px rgba(150,102,62,.75),
      0 2px 0 #e7cdb1;
    touch-action:none;
  }
  .board::before{
    content:""; position:absolute; inset:0; border-radius:24px; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.55) 1px, transparent 1px);
    background-size:14px 14px; opacity:.35; mix-blend-mode:soft-light;
  }

  .cell{
    position:relative;
    border-radius:16px;
    background:rgba(214,180,146,.24);
    box-shadow:inset 0 1px 2px rgba(163,116,74,.16);
  }

  .tile{
    position:absolute; inset:0;
    display:grid; place-items:center;
    border-radius:16px;
    font-weight:800; font-size:clamp(20px,7.2vw,30px);
    letter-spacing:.01em;
    color:#7d5b42;
    background:linear-gradient(180deg,#fffaf2,#fbeacc);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -3px 0 rgba(160,112,72,.10),
      0 6px 12px -10px rgba(120,78,46,.9);
    user-select:none;
    will-change:transform;
  }
  .tile.len3{ font-size:clamp(17px,6vw,25px); }
  .tile.len4{ font-size:clamp(15px,5.2vw,21px); }
  .tile.len5{ font-size:clamp(13px,4.4vw,18px); }

  .tile.v0{ background:transparent; box-shadow:none; }

  /* 暖暖色阶 */
  .tile.v2   { background:linear-gradient(180deg,#fffdf8,#fbeedb); }
  .tile.v4   { background:linear-gradient(180deg,#fef3e0,#f8e2c2); }
  .tile.v8   { background:linear-gradient(180deg,#f9d9b4,#f4c795); color:#7c5334; }
  .tile.v16  { background:linear-gradient(180deg,#f5bc8a,#eda06b); color:#fffaf2; }
  .tile.v32  { background:linear-gradient(180deg,#ef9d6d,#e6804f); color:#fffaf2; }
  .tile.v64  { background:linear-gradient(180deg,#e8825b,#db6b47); color:#fffaf6; }
  .tile.v128 { background:linear-gradient(180deg,#e06d55,#cf5641); color:#fff8ef; }
  .tile.v256 { background:linear-gradient(180deg,#d15a4c,#bc473c); color:#fff6ec; }
  .tile.v512 { background:linear-gradient(180deg,#c14a44,#a83a37); color:#fff4e8; }
  .tile.v1024{ background:linear-gradient(180deg,#ac3d3c,#8f2f33); color:#fff2e4;
               box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 2px rgba(255,214,170,.55), 0 10px 20px -12px rgba(120,40,40,.9); }
  .tile.v2048{ background:linear-gradient(180deg,#96333a,#75262e); color:#fff1e0;
               box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 2px rgba(255,206,150,.7), 0 0 22px rgba(255,183,120,.5), 0 10px 20px -12px rgba(120,40,40,.9); }
  .tile.vbig { background:linear-gradient(180deg,#6f2530,#4e1a24); color:#ffeede;
               box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 2px rgba(255,198,140,.75), 0 0 26px rgba(255,170,110,.55); }

  .tile.pop{ animation:pop .26s var(--ease); }
  .tile.spawn{ animation:spawn .28s var(--ease); }
  .tile.arrive{ animation:arrive .2s ease-out; }

  @keyframes pop{
    0%{ transform:scale(.72); }
    55%{ transform:scale(1.14); }
    100%{ transform:scale(1); }
  }
  @keyframes spawn{
    0%{ transform:scale(.3); opacity:0; }
    60%{ transform:scale(1.1); opacity:1; }
    100%{ transform:scale(1); }
  }
  @keyframes arrive{
    0%{ transform:scale(.88); opacity:.55; }
    100%{ transform:scale(1); opacity:1; }
  }

  /* ---------- 遮罩 ---------- */
  .overlay{
    position:absolute; inset:0; z-index:5;
    display:grid; place-items:center;
    border-radius:24px;
    background:rgba(255,246,235,.78);
    backdrop-filter:blur(4px) saturate(1.05);
    animation:fade .25s ease-out;
  }
  .overlay[hidden]{ display:none; }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

  .overlay-card{
    text-align:center; padding:20px 22px;
    width:min(280px,84%);
    background:linear-gradient(180deg,#fffdf8,#fdf2e3);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    animation:rise .3s var(--ease);
  }
  @keyframes rise{ from{ transform:translateY(10px) scale(.96); opacity:0; } to{ transform:none; opacity:1; } }
  .overlay-card h2{ margin:0 0 6px; font-size:22px; letter-spacing:.02em; }
  .overlay-card p{ margin:0 0 16px; font-size:13px; line-height:1.7; color:var(--ink-soft); }
  .overlay-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }

  .tips{ margin:0; text-align:center; font-size:11.5px; letter-spacing:.06em; color:var(--ink-faint); }
  .tips kbd{
    font-family:inherit; font-size:10.5px; font-weight:700;
    padding:1px 5px; border-radius:5px;
    background:rgba(255,255,255,.8); border:1px solid #e8d5bf; color:var(--ink-soft);
  }

  @media (max-width:400px){
    .brand h1{ font-size:34px; }
    .score{ min-width:66px; padding:6px 9px; }
    .hud .badge{ display:none; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }
</style>
</head>
<body>
<div class="blobs" aria-hidden="true">
  <span class="blob"></span><span class="blob"></span><span class="blob"></span><span class="blob"></span>
</div>

<main class="app">
  <header class="topbar">
    <div class="brand">
      <h1>2048</h1>
      <p class="sub">暖暖小屋 · 慢慢来就好</p>
    </div>
    <div class="scores">
      <div class="score" id="scoreCard"><span>分数</span><strong id="score">0</strong></div>
      <div class="score"><span>最高</span><strong id="best">0</strong></div>
    </div>
  </header>

  <div class="hud">
    <div class="badge" id="badge">壁炉还温着，先走一步试试</div>
    <div class="btns">
      <button class="btn ghost" id="undo" disabled>↩ 撤销</button>
      <button class="btn" id="newGame">✨ 新一局</button>
      <button class="btn icon" id="sound" title="声音">🔔</button>
    </div>
  </div>

  <section class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay" hidden>
      <div class="overlay-card">
        <h2 id="ovTitle">小屋打烊了</h2>
        <p id="ovText"></p>
        <div class="overlay-actions">
          <button class="btn ghost" id="ovContinue" hidden>继续玩</button>
          <button class="btn" id="ovRestart">再来一局</button>
        </div>
      </div>
    </div>
  </section>

  <p class="tips"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向键移动 · 手机上直接滑动</p>
</main>

<script>
(() => {
  'use strict';

  const N = 4;          // 可见棋盘 4x4
  const SIZE = 6;       // 与原 C 代码一致:外层带一圈 0 边界
  const BEST_KEY = 'cozy2048.best';
  const MUTE_KEY = 'cozy2048.muted';

  const $ = (id) => document.getElementById(id);
  const boardEl = $('board');
  const scoreEl = $('score');
  const bestEl = $('best');
  const scoreCard = $('scoreCard');
  const badgeEl = $('badge');
  const undoBtn = $('undo');
  const overlay = $('overlay');
  const ovTitle = $('ovTitle');
  const ovText = $('ovText');
  const ovContinue = $('ovContinue');

  /* ---------------- 盘面基础(照抄 C 语义) ---------------- */

  const mkBoard = () => Array.from({ length: SIZE }, () => new Array(SIZE).fill(0));
  const cloneBoard = (b) => b.map((row) => row.slice());

  function inner(board) {
    const out = new Array(N * N);
    for (let i = 1; i <= N; i++) {
      for (let j = 1; j <= N; j++) out[(i - 1) * N + (j - 1)] = board[i][j];
    }
    return out;
  }

  function sameInner(a, b) {
    for (let i = 1; i <= N; i++) {
      for (let j = 1; j <= N; j++) if (a[i][j] !== b[i][j]) return false;
    }
    return true;
  }

  // 对应 void put():每回合随机补 1 个格子,值为 2 或 4
  function putOne(board) {
    const empty = [];
    for (let i = 1; i <= N; i++) {
      for (let j = 1; j <= N; j++) if (board[i][j] === 0) empty.push([i, j]);
    }
    if (!empty.length) return null;
    const [i, j] = empty[(Math.random() * empty.length) | 0];
    board[i][j] = (Math.random() < 0.5 ? 1 : 2) * 2;
    return [i, j];
  }

  // 对应 void move():只做压实,不做合并
  function move(arr, d) {
    if (d === 'up') {
      for (let j = 1; j <= N; j++) {
        let k = 1;
        for (let i = 1; i <= N; i++) {
          if (arr[i][j] === 0) continue;
          if (i > k) { arr[k][j] = arr[i][j]; arr[i][j] = 0; }
          k++;
        }
      }
    } else if (d === 'down') {
      for (let j = 1; j <= N; j++) {
        let k = N;
        for (let i = N; i >= 1; i--) {
          if (arr[i][j] === 0) continue;
          if (i < k) { arr[k][j] = arr[i][j]; arr[i][j] = 0; }
          k--;
        }
      }
    } else if (d === 'left') {
      for (let i = 1; i <= N; i++) {
        let k = 1;
        for (let j = 1; j <= N; j++) {
          if (arr[i][j] === 0) continue;
          if (j > k) { arr[i][k] = arr[i][j]; arr[i][j] = 0; }
          k++;
        }
      }
    } else if (d === 'right') {
      for (let i = 1; i <= N; i++) {
        let k = N;
        for (let j = N; j >= 1; j--) {
          if (arr[i][j] === 0) continue;
          if (j < k) { arr[i][k] = arr[i][j]; arr[i][j] = 0; }
          k--;
        }
      }
    }
  }

  // 对应 int combine():单趟合并,返回本次得分
  function combine(arr, d) {
    let num = 0;
    if (d === 'up') {
      for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
          if (arr[i][j] === arr[i + 1][j]) {
            arr[i][j] *= 2; arr[i + 1][j] = 0; num += arr[i][j];
          }
        }
      }
    } else if (d === 'down') {
      for (let j = 1; j <= N; j++) {
        for (let i = N; i >= 1; i--) {
          if (arr[i][j] === arr[i - 1][j]) {
            arr[i][j] *= 2; arr[i - 1][j] = 0; num += arr[i][j];
          }
        }
      }
    } else if (d === 'left') {
      for (let i = 1; i <= N; i++) {
        for (let j = 1; j <= N; j++) {
          if (arr[i][j] === arr[i][j + 1]) {
            arr[i][j] *= 2; arr[i][j + 1] = 0; num += arr[i][j];
          }
        }
      }
    } else if (d === 'right') {
      for (let i = 1; i <= N; i++) {
        for (let j = N; j >= 1; j--) {
          if (arr[i][j] === arr[i][j - 1]) {
            arr[i][j] *= 2; arr[i][j - 1] = 0; num += arr[i][j];
          }
        }
      }
    }
    return num;
  }

  // 对应 int m_c():先压实 -> 再合并 -> 再压实
  function m_c(arr, d) {
    move(arr, d);
    const g = combine(arr, d);
    move(arr, d);
    return g;
  }

  // 对应 int finish():返回 true 表示还能继续
  function canContinue(arr) {
    for (let i = 1; i <= N; i++) {
      for (let j = 1; j <= N; j++) {
        const p = arr[i][j];
        if (p === 0) return true;
        if (p === arr[i + 1][j] || p === arr[i - 1][j] || p === arr[i][j + 1] || p === arr[i][j - 1]) return true;
      }
    }
    return false;
  }

  /* ---------------- 状态 ---------------- */

  const state = {
    board: mkBoard(),
    score: 0,
    best: Number(localStorage.getItem(BEST_KEY) || 0) || 0,
    moves: 0,
    history: [],
    over: false,
    won: false,
    freePlay: false,
    muted: localStorage.getItem(MUTE_KEY) === '1',
  };

  const cells = [];   // 16 个格子 DOM
  const tiles = [];   // 对应的 .tile

  function buildBoard() {
    for (let i = 0; i < N * N; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const tile = document.createElement('div');
      tile.className = 'tile v0';
      cell.appendChild(tile);
      boardEl.appendChild(cell);
      cells.push(cell);
      tiles.push(tile);
    }
  }

  const tileClassOf = (v) => (v === 0 ? 'v0' : v > 2048 ? 'vbig' : 'v' + v);
  const lenClassOf = (v) => {
    const n = String(v).length;
    return n >= 5 ? 'len5' : n === 4 ? 'len4' : n === 3 ? 'len3' : '';
  };

  function paint(idx, v, animClass) {
    const tile = tiles[idx];
    tile.className = 'tile ' + tileClassOf(v) + ' ' + lenClassOf(v);
    tile.textContent = v === 0 ? '' : v;
    if (animClass) {
      void tile.offsetWidth;           // 强制重排以重播动画
      tile.classList.add(animClass);
    }
  }

  function render(board, effects) {
    for (let i = 1; i <= N; i++) {
      for (let j = 1; j <= N; j++) {
        const idx = (i - 1) * N + (j - 1);
        const fx = effects ? effects.get(idx) : null;
        paint(idx, board[i][j], fx || '');
      }
    }
  }

  function syncHud() {
    scoreEl.textContent = state.score;
    bestEl.textContent = state.best;
    undoBtn.disabled = state.history.length === 0 || state.over;
  }

  function toast(text) {
    badgeEl.textContent = text;
  }

  function bumpScore() {
    scoreCard.classList.remove('bump');
    void scoreCard.offsetWidth;
    scoreCard.classList.add('bump');
    setTimeout(() => scoreCard.classList.remove('bump'), 200);
  }

  /* ---------------- 声音(无外部资源) ---------------- */

  let audioCtx = null;
  function blip(freq, dur, vol) {
    if (state.muted) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.82, t + dur);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (_) { /* 静默失败即可 */ }
  }

  /* ---------------- 游戏流程 ---------------- */

  function newGame() {
    state.board = mkBoard();
    state.score = 0;
    state.moves = 0;
    state.history = [];
    state.over = false;
    state.won = false;
    state.freePlay = false;
    overlay.hidden = true;

    // 开局铺两颗,让小屋先亮起来
    putOne(state.board);
    putOne(state.board);

    const effects = new Map();
    for (let i = 0; i < N * N; i++) effects.set(i, 'spawn');
    render(state.board, effects);
    syncHud();
    toast('壁炉还温着，先走一步试试');
  }

  function tryMove(dir) {
    if (state.over) return;

    const before = state.board;
    const next = cloneBoard(before);
    const gained = m_c(next, dir);

    if (sameInner(before, next)) { blip(180, 0.06, 0.03); return; }   // 这一步没变化,不补新格子

    state.history.push({ board: cloneBoard(before), score: state.score, moves: state.moves });
    if (state.history.length > 40) state.history.shift();

    const spawned = putOne(next);
    state.board = next;
    state.score += gained;
    state.moves += 1;

    const effects = new Map();
    for (let i = 1; i <= N; i++) {
      for (let j = 1; j <= N; j++) {
        const idx = (i - 1) * N + (j - 1);
        const o = before[i][j], n = next[i][j];
        if (n === 0) continue;
        if (o !== 0 && n === o * 2) effects.set(idx, 'pop');
        else if (o === 0) effects.set(idx, spawned && spawned[0] === i && spawned[1] === j ? 'spawn' : 'arrive');
      }
    }

    render(state.board, effects);

    if (state.score > state.best) {
      state.best = state.score;
      try { localStorage.setItem(BEST_KEY, String(state.best)); } catch (_) {}
    }
    syncHud();

    if (gained > 0) { bumpScore(); blip(520 + Math.min(gained, 400) * 0.9, 0.13, 0.05); }
    else blip(300, 0.07, 0.032);

    if (!state.won && inner(state.board).some((v) => v >= 2048)) {
      state.won = true;
      state.freePlay = false;
      showOverlay('🎉 灯火通明！', '拼出 2048 啦，这一屋子都暖烘烘的。', true);
      return;
    }

    if (!canContinue(state.board)) {
      state.over = true;
      syncHud();
      showOverlay('小屋里挤满啦', '这局得分 <b>' + state.score + '</b>，暖暖的余温还在。', false);
      blip(220, 0.3, 0.06);
      return;
    }

    if (state.moves % 20 === 0) {
      toast('已经走了 ' + state.moves + ' 步，歇口气也没关系');
    }
  }

  function showOverlay(title, text, withContinue) {
    ovTitle.textContent = title;
    ovText.innerHTML = text;
    ovContinue.hidden = !withContinue;
    overlay.hidden = false;
  }

  function undo() {
    const last = state.history.pop();
    if (!last) return;
    state.board = last.board;
    state.score = last.score;
    state.moves = last.moves;
    state.over = false;
    overlay.hidden = true;
    render(state.board);
    syncHud();
    toast('退回去一步，杯子还热着');
    blip(360, 0.1, 0.04);
  }

  /* ---------------- 输入 ---------------- */

  const KEYMAP = {
    w: 'up', s: 'down', a: 'left', d: 'right',
    arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right',
  };

  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const dir = KEYMAP[e.key.toLowerCase()];
    if (dir) { e.preventDefault(); tryMove(dir); }
  }, { passive: false });

  let touchStart = null;
  boardEl.addEventListener('pointerdown', (e) => {
    touchStart = { x: e.clientX, y: e.clientY, id: e.pointerId };
  });
  boardEl.addEventListener('pointerup', (e) => {
    if (!touchStart || e.pointerId !== touchStart.id) return;
    const dx = e.clientX - touchStart.x;
    const dy = e.clientY - touchStart.y;
    touchStart = null;
    if (Math.hypot(dx, dy) < 24) return;
    tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  boardEl.addEventListener('pointercancel', () => { touchStart = null; });

  /* ---------------- 按钮 ---------------- */

  $('newGame').addEventListener('click', newGame);
  $('ovRestart').addEventListener('click', newGame);
  undoBtn.addEventListener('click', undo);
  ovContinue.addEventListener('click', () => {
    state.freePlay = true;
    overlay.hidden = true;
  });

  const soundBtn = $('sound');
  function syncSoundBtn() {
    soundBtn.textContent = state.muted ? '🔇' : '🔔';
    soundBtn.title = state.muted ? '已静音，点一下开声音' : '声音已开，点一下静音';
  }
  soundBtn.addEventListener('click', () => {
    state.muted = !state.muted;
    try { localStorage.setItem(MUTE_KEY, state.muted ? '1' : '0'); } catch (_) {}
    syncSoundBtn();
    if (!state.muted) blip(620, 0.12, 0.05);
  });

  /* ---------------- 启动 ---------------- */

  buildBoard();
  syncSoundBtn();
  newGame();
})();
</script>
</body>
</html>
