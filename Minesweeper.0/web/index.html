<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>扫雷 · 暖暖小屋</title>
<style>
  :root{
    --ink:#6b5142;
    --ink-soft:#9a8070;
    --ink-faint:#b7a08d;
    --line:#efdcc8;
    --shadow:0 22px 45px -22px rgba(150,102,62,.5), 0 6px 14px -8px rgba(150,102,62,.25);
    --ease:cubic-bezier(.22,1.2,.36,1);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }

  body{
    margin:0;
    display:grid; place-items:center;
    padding:24px 14px 40px;
    font-family:"Nunito","Quicksand","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 620px at 50% -12%, #ffe9d1 0%, rgba(255,233,209,0) 62%),
      radial-gradient(760px 520px at 8% 108%, #ffe3cf 0%, rgba(255,227,207,0) 60%),
      radial-gradient(820px 560px at 96% 96%, #f7dcc4 0%, rgba(247,220,196,0) 62%),
      linear-gradient(180deg,#fdf1e2 0%,#f6e3d0 52%,#f1d8c3 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }

  .blobs{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .blob{
    position:absolute; border-radius:50%; filter:blur(28px); opacity:.5;
    animation:drift 18s ease-in-out infinite;
  }
  .blob:nth-child(1){ width:230px; height:230px; left:4%; top:12%; background:#ffd8b3; }
  .blob:nth-child(2){ width:180px; height:180px; right:6%; top:24%; background:#ffcfa8; animation-delay:-6s; }
  .blob:nth-child(3){ width:260px; height:260px; right:14%; bottom:2%; background:#ffdcbe; animation-delay:-11s; }
  .blob:nth-child(4){ width:160px; height:160px; left:12%; bottom:6%; background:#f8cdbf; animation-delay:-3s; }
  @keyframes drift{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%{ transform:translate3d(14px,-22px,0) scale(1.07); }
  }

  .app{
    position:relative; z-index:1;
    width:min(440px, 100%);
    display:flex; flex-direction:column; gap:12px;
  }

  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }

  .brand h1{
    margin:0;
    font-size:38px; line-height:1; letter-spacing:.02em; font-weight:800;
    background:linear-gradient(160deg,#e8875f 0%,#c9603f 55%,#a44a34 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 2px 0 rgba(255,255,255,.55);
  }
  .brand .sub{ margin:6px 0 0; font-size:12.5px; color:var(--ink-soft); letter-spacing:.08em; }

  .scores{ display:flex; gap:8px; }
  .score{
    min-width:68px; padding:7px 11px 8px;
    background:linear-gradient(180deg,#fffdf9,#fdf1e2);
    border:1px solid var(--line);
    border-radius:14px;
    text-align:center;
    box-shadow:inset 0 1px 0 #fff, 0 6px 12px -10px rgba(150,102,62,.7);
  }
  .score span{ display:block; font-size:10.5px; letter-spacing:.14em; color:var(--ink-faint); }
  .score strong{ display:block; font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; }

  /* 难度 */
  .modes{
    display:flex; gap:5px; padding:4px;
    background:rgba(255,250,243,.62);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:inset 0 1px 0 #fff;
  }
  .mode{
    flex:1 1 0; min-width:0;
    appearance:none; -webkit-appearance:none;
    border:0; cursor:pointer; font-family:inherit;
    font-size:12.5px; font-weight:700; color:var(--ink-faint);
    padding:7px 4px; border-radius:10px; background:transparent;
    transition:color .18s ease, background .18s ease, box-shadow .18s ease;
    white-space:nowrap;
  }
  .mode.active{
    color:#7a4a2f;
    background:linear-gradient(180deg,#fff8ee,#fdeacd);
    box-shadow:0 2px 6px -4px rgba(150,102,62,.9), inset 0 1px 0 #fff;
  }

  .hud{ display:flex; align-items:center; gap:8px; }
  .status{
    flex:1 1 auto; min-width:0;
    margin:0; padding:7px 12px;
    font-size:12px; color:var(--ink-soft);
    background:rgba(255,250,243,.72);
    border:1px dashed #e6cfb6;
    border-radius:999px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .btn{
    appearance:none; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:700; color:#7a4a2f;
    padding:8px 13px;
    border:1px solid #eccfae;
    border-radius:12px;
    background:linear-gradient(180deg,#ffeedb,#fcdcc0);
    box-shadow:0 3px 0 #e9c4a3, 0 8px 14px -10px rgba(150,102,62,.9), inset 0 1px 0 #fff;
    transition:transform .12s var(--ease), box-shadow .12s ease, filter .15s ease;
    white-space:nowrap;
  }
  .btn:hover{ filter:brightness(1.03); }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #e9c4a3, 0 4px 8px -8px rgba(150,102,62,.9), inset 0 1px 0 #fff; }
  .btn.ghost{
    background:rgba(255,252,247,.7); color:var(--ink-soft); border-color:#e8d6c2;
    box-shadow:0 2px 0 #e8d6c2, inset 0 1px 0 #fff;
  }
  .btn.ghost:active{ box-shadow:0 0 0 #e8d6c2, inset 0 1px 0 #fff; }
  .btn.icon{ padding:8px 10px; font-size:14px; }

  /* ---------- 棋盘 ---------- */
  .board-wrap{ position:relative; }

  .board{
    container-type:inline-size;
    display:grid;
    gap:2px;
    padding:8px;
    border-radius:20px;
    background:
      linear-gradient(180deg,#f4e3cf,#edd6bc);
    box-shadow:
      inset 0 2px 6px rgba(163,116,74,.20),
      inset 0 -2px 0 rgba(255,255,255,.5),
      0 16px 30px -20px rgba(150,102,62,.75),
      0 2px 0 #e7cdb1;
    touch-action:manipulation;
    user-select:none;
    grid-template-columns:repeat(var(--n, 9), 1fr);
    font-size:15px;
  }

  .cell{
    position:relative;
    aspect-ratio:1/1;
    display:grid; place-items:center;
    border-radius:6px;
    font-weight:800;
    line-height:1;
    cursor:pointer;
    background:linear-gradient(180deg,#f7e4c9,#e7c9a6);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -2px 0 rgba(150,100,60,.22),
      0 1px 2px rgba(140,100,64,.18);
    transition:background .12s ease, transform .1s var(--ease);
  }
  .cell:hover{ background:linear-gradient(180deg,#fff5e4,#f0d8b8); }
  .cell:active{ transform:scale(.96); }

  .cell.open{
    cursor:default;
    background:linear-gradient(180deg,#fffcf6,#fdf4e6);
    box-shadow:inset 0 1px 2px rgba(170,126,86,.14);
    transform:none;
  }
  .cell.open:hover{ background:linear-gradient(180deg,#fffcf6,#fdf4e6); }

  .cell.flag{ background:linear-gradient(180deg,#fff0d8,#fbe2bd); }
  .cell.flag .glyph{ font-size:.82em; animation:flagpulse .3s var(--ease); }
  @keyframes flagpulse{ 0%{ transform:scale(.6); } 60%{ transform:scale(1.15); } 100%{ transform:scale(1); } }

  .cell.boom{
    background:linear-gradient(180deg,#f6c6ae,#e9a288);
    box-shadow:inset 0 1px 3px rgba(150,60,40,.35);
    animation:boom .3s ease-out;
  }
  @keyframes boom{ 0%{ transform:scale(1.18); } 100%{ transform:scale(1); } }

  .cell.mine{ background:linear-gradient(180deg,#f6dcc6,#f0cbb0); }
  .cell.wrong{ background:linear-gradient(180deg,#f3d3cf,#e7bab6); }
  .cell.wrong .glyph::after{
    content:""; position:absolute; left:12%; right:12%; top:50%; height:2px;
    background:#b56052; border-radius:2px; transform:rotate(-18deg);
  }

  .cell .glyph{ position:relative; display:grid; place-items:center; }

  /* 数字配色(暖暖系) */
  .cell.n1{ color:#c0764f; }
  .cell.n2{ color:#6f8f6a; }
  .cell.n3{ color:#c1573f; }
  .cell.n4{ color:#7b6aa8; }
  .cell.n5{ color:#a35a34; }
  .cell.n6{ color:#4f8a8b; }
  .cell.n7{ color:#6b5142; }
  .cell.n8{ color:#9a8070; }

  .cell.pop{ animation:popIn .2s var(--ease); }
  @keyframes popIn{
    0%{ transform:scale(.82); opacity:.4; }
    100%{ transform:scale(1); opacity:1; }
  }

  .cell.rainbow{ animation:rainbow 1.2s ease-in-out infinite; }
  @keyframes rainbow{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.12); }
  }

  /* ---------- 遮罩 ---------- */
  .overlay{
    position:absolute; inset:0; z-index:6;
    display:grid; place-items:center;
    border-radius:20px;
    background:rgba(255,246,235,.8);
    backdrop-filter:blur(4px) saturate(1.05);
    animation:fade .25s ease-out;
  }
  .overlay[hidden]{ display:none; }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

  .overlay-card{
    text-align:center; padding:20px 22px;
    width:min(280px,86%);
    background:linear-gradient(180deg,#fffdf8,#fdf2e3);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    animation:rise .3s var(--ease);
  }
  @keyframes rise{ from{ transform:translateY(10px) scale(.96); opacity:0; } to{ transform:none; opacity:1; } }
  .overlay-card h2{ margin:0 0 6px; font-size:21px; letter-spacing:.02em; }
  .overlay-card p{ margin:0 0 16px; font-size:13px; line-height:1.7; color:var(--ink-soft); }
  .overlay-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }

  .tips{ margin:0; text-align:center; font-size:11.5px; letter-spacing:.04em; color:var(--ink-faint); }
  .tips kbd{
    font-family:inherit; font-size:10.5px; font-weight:700;
    padding:1px 5px; border-radius:5px;
    background:rgba(255,255,255,.8); border:1px solid #e8d5bf; color:var(--ink-soft);
  }

  @media (max-width:400px){
    .brand h1{ font-size:31px; }
    .score{ min-width:60px; padding:6px 8px; }
    .status{ display:none; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }
</style>
</head>
<body>
<div class="blobs" aria-hidden="true">
  <span class="blob"></span><span class="blob"></span><span class="blob"></span><span class="blob"></span>
</div>

<main class="app">
  <header class="topbar">
    <div class="brand">
      <h1>扫雷</h1>
      <p class="sub">暖暖小屋 · 小心脚下</p>
    </div>
    <div class="scores">
      <div class="score"><span>剩余雷</span><strong id="mineLeft">10</strong></div>
      <div class="score"><span>用时</span><strong id="timer">00:00</strong></div>
    </div>
  </header>

  <div class="modes" id="diffs" role="group" aria-label="难度">
    <button class="mode active" type="button" data-diff="easy">简单</button>
    <button class="mode" type="button" data-diff="normal">普通</button>
    <button class="mode" type="button" data-diff="hard">困难</button>
    <button class="mode" type="button" data-diff="expert">极难</button>
  </div>

  <div class="hud">
    <p class="status" id="status">9 × 9 · 10 颗蘑菇 · 点第一格开始</p>
    <button class="btn" id="newGame">✨ 新一局</button>
    <button class="btn icon" id="sound" title="声音">🔔</button>
  </div>

  <section class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay" hidden>
      <div class="overlay-card">
        <h2 id="ovTitle"></h2>
        <p id="ovText"></p>
        <div class="overlay-actions">
          <button class="btn ghost" id="ovAgain">再来一局</button>
        </div>
      </div>
    </div>
  </section>

  <p class="tips"><kbd>左键</kbd> 翻开 · <kbd>右键</kbd>/长按 插旗 · 点已翻开的数字可快速排雷</p>
</main>

<script>
(() => {
  'use strict';

  // 四档难度(简单这档与你原来的 C 版一致:9×9、10 颗雷)
  const DIFFS = {
    easy:   { name: '简单', n: 9,  mines: 10 },
    normal: { name: '普通', n: 12, mines: 22 },
    hard:   { name: '困难', n: 16, mines: 40 },
    expert: { name: '极难', n: 20, mines: 70 },
  };

  const $ = (id) => document.getElementById(id);
  const boardEl = $('board');
  const mineLeftEl = $('mineLeft');
  const timerEl = $('timer');
  const statusEl = $('status');
  const overlay = $('overlay');
  const ovTitle = $('ovTitle');
  const ovText = $('ovText');

  const state = {
    diff: localStorage.getItem('cozyMine.diff') || 'easy',
    n: 0,
    mines: 0,
    mine: [],       // 是否雷
    num: [],        // 周围雷数
    open: [],       // 已翻开
    flag: [],       // 已插旗
    cells: [],      // DOM
    started: false,
    over: false,
    won: false,
    flagged: 0,
    opened: 0,
    time: 0,
    timerId: null,
    muted: localStorage.getItem('cozyMine.muted') === '1',
  };

  const idx = (x, y) => y * state.n + x;
  const inBoard = (x, y) => x >= 0 && y >= 0 && x < state.n && y < state.n;

  /* ---------------- 声音 ---------------- */

  let audioCtx = null;
  function blip(freq, dur, vol, type) {
    if (state.muted) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.85, t + dur);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (_) { /* 静默失败 */ }
  }

  /* ---------------- 建盘 ---------------- */

  function build() {
    const cfg = DIFFS[state.diff];
    state.n = cfg.n;
    state.mines = cfg.mines;
    state.mine = new Array(cfg.n * cfg.n).fill(false);
    state.num = new Array(cfg.n * cfg.n).fill(0);
    state.open = new Array(cfg.n * cfg.n).fill(false);
    state.flag = new Array(cfg.n * cfg.n).fill(false);
    state.started = false;
    state.over = false;
    state.won = false;
    state.flagged = 0;
    state.opened = 0;
    state.time = 0;
    clearInterval(state.timerId);
    state.timerId = null;

    boardEl.style.setProperty('--n', cfg.n);
    boardEl.innerHTML = '';
    state.cells = [];

    for (let y = 0; y < cfg.n; y++) {
      for (let x = 0; x < cfg.n; x++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.x = x;
        cell.dataset.y = y;
        const g = document.createElement('span');
        g.className = 'glyph';
        cell.appendChild(g);

        cell.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleFlag(x, y); });
        bindPress(cell, x, y);
        cell.addEventListener('click', () => {
          if (suppressClick) { suppressClick = false; return; }
          handleOpen(x, y);
        });

        boardEl.appendChild(cell);
        state.cells.push(cell);
      }
    }

    fitFont();
    paintAll();
    overlay.hidden = true;
    updateHud();
    const best = bestTime();
    setStatus(cfg.n + ' × ' + cfg.n + ' · ' + cfg.mines + ' 颗蘑菇' + (best ? ' · 最佳 ' + fmt(best) : '') + ' · 点第一格开始');
  }

  function fitFont() {
    const n = state.n;
    const pad = 16, gap = 2;
    const w = boardEl.clientWidth || 380;
    const cell = (w - pad - gap * (n - 1)) / n;
    boardEl.style.fontSize = Math.max(8, cell * 0.56) + 'px';
  }

  /* ---------------- 首击安全 + 布雷 ---------------- */

  function placeMines(sx, sy) {
    const n = state.n;
    const safe = new Set();
    // 第一格以及它周围一圈都留空(格数够的话),开局更舒服
    if (n * n - state.mines >= 9) {
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (inBoard(sx + dx, sy + dy)) safe.add(idx(sx + dx, sy + dy));
        }
      }
    } else {
      safe.add(idx(sx, sy));
    }

    const pool = [];
    for (let i = 0; i < n * n; i++) if (!safe.has(i)) pool.push(i);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    for (let k = 0; k < state.mines && k < pool.length; k++) state.mine[pool[k]] = true;

    // 只算一次周围雷数
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        if (state.mine[idx(x, y)]) { state.num[idx(x, y)] = -1; continue; }
        let c = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            if (inBoard(x + dx, y + dy) && state.mine[idx(x + dx, y + dy)]) c++;
          }
        }
        state.num[idx(x, y)] = c;
      }
    }
  }

  /* ---------------- 操作 ---------------- */

  function handleOpen(x, y) {
    if (state.over) return;
    const i = idx(x, y);
    if (state.flag[i]) return;

    if (state.open[i]) { chord(x, y); return; }      // 点数字:快速排雷

    if (!state.started) {
      state.started = true;
      placeMines(x, y);
      startTimer();
      const best = bestTime();
      setStatus(state.n + ' × ' + state.n + ' · ' + state.mines + ' 颗蘑菇' + (best ? ' · 最佳 ' + fmt(best) : '') + ' · 小心脚下');
    }

    if (state.mine[i]) { lose(i); return; }
    floodOpen(x, y);
    blip(430 + Math.min(state.num[i], 8) * 40, 0.07, 0.035);
    paintAll();
    updateHud();
    checkWin();
  }

  function floodOpen(x, y) {
    const stack = [[x, y]];
    while (stack.length) {
      const [cx, cy] = stack.pop();
      if (!inBoard(cx, cy)) continue;
      const i = idx(cx, cy);
      if (state.open[i] || state.flag[i] || state.mine[i]) continue;
      state.open[i] = true;
      state.opened++;
      if (state.num[i] === 0) {
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            stack.push([cx + dx, cy + dy]);
          }
        }
      }
    }
  }

  function chord(x, y) {
    const i = idx(x, y);
    if (!state.open[i] || state.num[i] <= 0) return;
    let flags = 0;
    const around = [];
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        if (!inBoard(x + dx, y + dy)) continue;
        const j = idx(x + dx, y + dy);
        if (state.flag[j]) flags++;
        else if (!state.open[j]) around.push([x + dx, y + dy]);
      }
    }
    if (flags !== state.num[i] || !around.length) return;

    let hitMine = -1;
    for (const [ax, ay] of around) if (state.mine[idx(ax, ay)]) { hitMine = idx(ax, ay); break; }
    if (hitMine >= 0) { lose(hitMine); return; }

    for (const [ax, ay] of around) floodOpen(ax, ay);
    blip(560, 0.08, 0.035);
    paintAll();
    updateHud();
    checkWin();
  }

  function toggleFlag(x, y) {
    if (state.over) return;
    const i = idx(x, y);
    if (state.open[i]) return;
    state.flag[i] = !state.flag[i];
    state.flagged += state.flag[i] ? 1 : -1;
    blip(state.flag[i] ? 700 : 380, 0.08, 0.04, 'triangle');
    paintAll();
    updateHud();
  }

  /* ---------------- 输赢 ---------------- */

  function lose(hit) {
    state.over = true;
    stopTimer();
    for (let i = 0; i < state.mine.length; i++) {
      if (state.mine[i]) state.open[i] = true;
    }
    paintAll();
    state.cells[hit].classList.add('boom');
    setStatus('踩到蘑菇了…');
    blip(150, 0.32, 0.06, 'sawtooth');
    showOverlay('踩到蘑菇了 🍄', '这一局走了 <b>' + fmt(state.time) + '</b>，' +
      '还剩 <b>' + Math.max(0, state.mines - state.flagged) + '</b> 颗没标。');
  }

  function checkWin() {
    if (state.over) return;
    if (state.opened !== state.n * state.n - state.mines) return;

    state.over = true;
    state.won = true;
    stopTimer();

    // 剩下的雷自动插旗
    for (let i = 0; i < state.mine.length; i++) {
      if (state.mine[i] && !state.flag[i]) { state.flag[i] = true; state.flagged++; }
    }
    paintAll();
    updateHud();
    state.cells.forEach((c) => c.classList.add('rainbow'));
    blip(660, 0.16, 0.05);
    setTimeout(() => blip(830, 0.2, 0.045), 130);
    setTimeout(() => blip(990, 0.24, 0.04), 260);
    setStatus('全部扫完，' + fmt(state.time));

    const key = 'cozyMine.best.' + state.diff;
    const prev = Number(localStorage.getItem(key) || 0);
    const isBest = !prev || state.time < prev;
    if (isBest) { try { localStorage.setItem(key, String(state.time)); } catch (_) {} }

    showOverlay('扫完啦 ✨', (isBest ? '<b>新纪录！</b> ' : '') +
      '用时 <b>' + fmt(state.time) + '</b>' + (prev && !isBest ? '，最佳 ' + fmt(prev) : '') +
      '。<br>' + DIFFS[state.diff].name + ' · ' + state.n + ' × ' + state.n + ' · ' + state.mines + ' 颗蘑菇');
  }

  /* ---------------- 渲染 ---------------- */

  function paintAll() {
    for (let i = 0; i < state.cells.length; i++) paintCell(i);
  }

  function paintCell(i) {
    const el = state.cells[i];
    const g = el.firstChild;
    const isOpen = state.open[i];
    const isFlag = state.flag[i];
    const isMine = state.mine[i];

    el.className = 'cell';
    el.textContent = '';
    el.appendChild(g);
    g.textContent = '';

    if (isOpen) {
      el.classList.add('open');
      if (isMine) {
        el.classList.add('mine');
        g.textContent = '🍄';
      } else if (state.num[i] > 0) {
        el.classList.add('n' + state.num[i]);
        g.textContent = state.num[i];
      }
    } else if (isFlag) {
      el.classList.add('flag');
      g.textContent = '🚩';
    }

    // 输掉时把插错的旗子划掉
    if (state.over && !state.won && isFlag && !isMine) el.classList.add('wrong');
  }

  function updateHud() {
    mineLeftEl.textContent = Math.max(0, state.mines - state.flagged);
    timerEl.textContent = fmt(state.time);
  }

  function setStatus(t) { statusEl.textContent = t; }

  const fmt = (s) => {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  };

  const bestTime = () => Number(localStorage.getItem('cozyMine.best.' + state.diff) || 0);

  /* ---------------- 计时 ---------------- */

  function startTimer() {
    clearInterval(state.timerId);
    state.timerId = setInterval(() => {
      state.time++;
      updateHud();
      if (state.time === 600) setStatus('十分钟了…要不要先喝口水');
    }, 1000);
  }
  function stopTimer() {
    clearInterval(state.timerId);
    state.timerId = null;
  }

  /* ---------------- 长按插旗(手机) ---------------- */

  let pressTimer = null;
  let suppressClick = false;

  function bindPress(cell, x, y) {
    cell.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse') return;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        pressTimer = null;
        suppressClick = true;
        toggleFlag(x, y);
        if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }
      }, 380);
    });
    const cancel = () => { clearTimeout(pressTimer); pressTimer = null; };
    cell.addEventListener('pointerup', cancel);
    cell.addEventListener('pointerleave', cancel);
    cell.addEventListener('pointercancel', cancel);
  }

  /* ---------------- 遮罩 / 按钮 ---------------- */

  function showOverlay(title, html) {
    ovTitle.textContent = title;
    ovText.innerHTML = html;
    overlay.hidden = false;
  }

  const diffBar = $('diffs');
  function syncDiffs() {
    Array.prototype.forEach.call(diffBar.querySelectorAll('.mode'), (b) => {
      b.classList.toggle('active', b.dataset.diff === state.diff);
    });
  }
  diffBar.addEventListener('click', (e) => {
    const btn = e.target.closest ? e.target.closest('.mode') : null;
    if (!btn || btn.dataset.diff === state.diff) return;
    state.diff = btn.dataset.diff;
    try { localStorage.setItem('cozyMine.diff', state.diff); } catch (_) {}
    syncDiffs();
    build();
    blip(520, 0.1, 0.04);
  });

  $('newGame').addEventListener('click', () => { build(); blip(460, 0.09, 0.04); });
  $('ovAgain').addEventListener('click', () => { build(); blip(460, 0.09, 0.04); });
  boardEl.addEventListener('contextmenu', (e) => e.preventDefault());

  const soundBtn = $('sound');
  function syncSoundBtn() {
    soundBtn.textContent = state.muted ? '🔇' : '🔔';
    soundBtn.title = state.muted ? '已静音，点一下开声音' : '声音已开，点一下静音';
  }
  soundBtn.addEventListener('click', () => {
    state.muted = !state.muted;
    try { localStorage.setItem('cozyMine.muted', state.muted ? '1' : '0'); } catch (_) {}
    syncSoundBtn();
    if (!state.muted) blip(620, 0.12, 0.05);
  });

  if (window.ResizeObserver) {
    new ResizeObserver(() => fitFont()).observe(boardEl);
  } else {
    window.addEventListener('resize', fitFont);
  }
  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') { build(); blip(460, 0.09, 0.04); }
  });

  /* ---------------- 启动 ---------------- */

  syncDiffs();
  syncSoundBtn();
  build();
})();
</script>
</body>
</html>
